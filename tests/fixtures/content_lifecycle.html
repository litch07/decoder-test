<!doctype html>
<meta charset="utf-8">
<title>Content ownership and chart lifecycle checks</title>
<style>
  body { margin: 20px; font: 14px system-ui; }
  iframe { width: 500px; height: 150px; }
  .highcharts-container { width: 500px; height: 180px; }
  #results { white-space: pre-wrap; }
</style>
<p id="main-course">CSE 3421</p>
<div id="dynamic"></div>
<iframe id="frame" srcdoc="<!doctype html><p id='frame-course'>CSE 3421</p>"></iframe>
<div class="highcharts-container" id="chart">
  <svg width="500" height="180">
    <rect id="point" class="highcharts-point" x="40" y="20" width="40" height="80" fill="#8ab7eb" />
    <g class="highcharts-tooltip" transform="translate(100,20)">
      <rect class="highcharts-label-box" width="220" height="90" fill="white" />
      <text x="8" y="14"><tspan id="chart-source">CSE 3421 (E)</tspan><tspan x="8" dy="18">Remaining: 21 (88%)</tspan><tspan x="8" dy="18">Absent: 0 (0%)</tspan><tspan x="8" dy="18">Present: 3 (13%)</tspan></text>
    </g>
  </svg>
</div>
<pre id="results">Running checks...</pre>
<script>
  const saved = {
    courses: {
      'CSE 3421': {name: 'Software Engineering', credits: 3, examDay: 'Day 5', examSlot: 'T3', prerequisites: ['CSE 3411']},
      'CSE 3411': {name: 'System Analysis and Design', credits: 3, prerequisites: ['None']}
    },
    mode: 'inline', allowedSites: ['localhost', '127.0.0.1'], showExamInfo: true, showPrerequisites: true
  };
  const listeners = [];
  const runtimeErrors = [];
  window.addEventListener('error', event => runtimeErrors.push(event.message));
  let reads = 0;
  window.chrome = {runtime: {id: 'lifecycle-fixture'}, storage: {
    local: {get(keys, callback) { reads++; callback(JSON.parse(JSON.stringify(saved))); }},
    onChanged: {addListener(callback) { listeners.push(callback); }}
  }};
  function change(values) {
    const changes = {};
    for (const [key, value] of Object.entries(values)) {
      changes[key] = {oldValue: saved[key], newValue: value};
      saved[key] = value;
    }
    listeners.forEach(listener => listener(changes, 'local'));
  }
</script>
<script src="../../content.js"></script>
<script>
  const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
  const checks = [];
  const check = (condition, label) => { if (!condition) throw Error(label); checks.push(label); };
  async function waitFor(test) {
    for (let i = 0; i < 40; i++) { if (test()) return; await pause(50); }
    throw Error('Timed out waiting for the content lifecycle');
  }
  function loadAgain(doc) {
    return new Promise((resolve, reject) => {
      const script = doc.createElement('script');
      script.src = new URL('../../content.js', location.href).href;
      script.onload = resolve; script.onerror = reject;
      doc.head.appendChild(script);
    });
  }
  (async () => {
    try {
      const frame = document.getElementById('frame');
      await waitFor(() => frame.contentDocument.querySelector('.cce-inline'));
      const frameDoc = frame.contentDocument;
      check(document.querySelectorAll('#main-course > .cce-inline').length === 1, 'Initial page renders one course wrapper');
      check(frameDoc.querySelectorAll('#frame-course > .cce-inline').length === 1, 'Fallback frame renders one wrapper');
      check(frame.contentWindow.__UIU_COURSE_DECODER_INJECTED__, 'Fallback claims frame ownership');
      frame.contentWindow.chrome = window.chrome;
      await loadAgain(document);
      await loadAgain(frameDoc);
      check(reads === 1 && listeners.length === 1, 'Repeated main/frame injection does not initialize another controller');
      check(document.querySelectorAll('#cce-custom-styles').length === 1 && frameDoc.querySelectorAll('#cce-custom-styles').length === 1, 'Each document has one stylesheet');
      check(document.querySelectorAll('.cce-global-tooltip').length === 1 && frameDoc.querySelectorAll('.cce-global-tooltip').length === 1, 'Each document has one tooltip');
      const late = frameDoc.createElement('p'); late.id = 'late'; late.textContent = 'CSE 3411'; frameDoc.body.appendChild(late);
      await waitFor(() => late.querySelector('.cce-inline'));
      check(late.querySelectorAll('[data-cce-key]').length === 1, 'Frame DOM mutations are decoded once');
      history.replaceState(null, '', '?navigation=1');
      const first = document.createElement('p'); first.textContent = 'CSE 3421 / CSE 3411'; document.getElementById('dynamic').appendChild(first);
      await waitFor(() => first.querySelectorAll('[data-cce-key]').length === 2);
      check(first.querySelector('[data-cce-key="CSE 3421"]') && first.querySelector('[data-cce-key="CSE 3411"]'), 'Navigation mutations preserve distinct courses');
      change({showExamInfo: false});
      check(!frameDoc.querySelector('.cce-inline').textContent.includes('Day 5'), 'Detail settings update fallback frames');
      change({mode: 'tooltip'});
      check(frameDoc.querySelectorAll('.cce-inline').length === 0 && frameDoc.querySelectorAll('.cce-tooltip-wrap').length === 2, 'Mode changes replace frame output once');
      frameDoc.querySelector('.cce-tooltip-wrap').focus();
      await waitFor(() => frameDoc.querySelector('.cce-global-tooltip').classList.contains('cce-visible'));
      check(frameDoc.querySelector('.cce-global-tooltip').classList.contains('cce-visible'), 'Frame tooltip remains keyboard accessible');
      change({allowedSites: []});
      check(!frameDoc.querySelector('[data-cce-key]') && !document.querySelector('[data-cce-key]'), 'Disabling cleans main and fallback frame output');
      change({allowedSites: ['127.0.0.1', 'localhost'], mode: 'highlight'});
      check(frameDoc.querySelectorAll('.cce-highlight').length === 2, 'Re-enabling restores each frame course once');
      const catalog = saved.courses;
      change({courses: {}});
      check(!frameDoc.querySelector('[data-cce-key]') && !document.querySelector('[data-cce-key]'), 'Empty catalog removes stale output everywhere');
      change({courses: catalog});
      check(frameDoc.querySelectorAll('.cce-highlight').length === 2, 'Restoring the catalog redecorates frame courses once');
      change({courses: JSON.parse(JSON.stringify(catalog))});
      change({courses: JSON.parse(JSON.stringify(catalog))});
      check(frameDoc.querySelectorAll('.cce-highlight').length === 2 && listeners.length === 1, 'Repeated popup-style catalog refreshes retain one wrapper and controller');
      const navigated = new Promise(resolve => frame.addEventListener('load', resolve, {once: true}));
      frame.srcdoc = "<!doctype html><p id='replacement'>CSE 3411</p>";
      await navigated;
      await waitFor(() => frame.contentDocument.querySelector('.cce-highlight'));
      check(!frameDoc.querySelector('[data-cce-key]'), 'Frame navigation cleans the retired document');
      check(frame.contentDocument.querySelectorAll('[data-cce-key]').length === 1, 'Frame navigation initializes the new document once');
      const native = document.querySelector('.highcharts-tooltip');
      check(!native.textContent.includes('Software Engineering') && !native.querySelector('.cce-custom-tooltip-group'), 'Native chart contains no legacy extension presentation');
      const point = document.getElementById('point');
      await waitFor(() => {
        point.dispatchEvent(new MouseEvent('mousemove', {bubbles: true}));
        return document.querySelector('.cce-global-tooltip').classList.contains('cce-visible');
      });
      const tip = document.querySelector('.cce-global-tooltip');
      check(tip.classList.contains('cce-chart-popup') && tip.textContent.split('Software Engineering').length === 2, 'Chart hover shows one HTML course presentation');
      check(tip.querySelectorAll('.cce-chart-history-row').length === 3, 'One attendance summary preserves all status rows');
      const source = document.getElementById('chart-source');
      source.textContent = 'CSE 3411 (A)';
      await waitFor(() => source.querySelector('[data-cce-key="CSE 3411"]'));
      await waitFor(() => {
        point.dispatchEvent(new MouseEvent('mousemove', {bubbles: true}));
        return tip.classList.contains('cce-visible') && tip.textContent.includes('System Analysis and Design');
      });
      check(tip.textContent.includes('System Analysis and Design') && !tip.textContent.includes('Software Engineering'), 'Async chart update replaces the course rather than appending another');
      point.dispatchEvent(new MouseEvent('click', {bubbles: true}));
      await pause(30);
      tip.dispatchEvent(new MouseEvent('mouseout', {bubbles: true}));
      await pause(170);
      check(tip.classList.contains('cce-visible'), 'Click pins the single chart card');
      document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
      check(!tip.classList.contains('cce-visible'), 'Escape dismisses the pinned chart card');
      source.textContent = 'Unlisted chart event';
      await pause(40);
      check(getComputedStyle(native).visibility === 'visible', 'Unrecognized chart items retain their native presentation');
      change({allowedSites: []});
      const disabledNavigation = new Promise(resolve => frame.addEventListener('load', resolve, {once: true}));
      frame.srcdoc = "<!doctype html><p id='reenabled-course'>CSE 3421</p>";
      await disabledNavigation;
      await pause(150);
      check(!frame.contentDocument.querySelector('[data-cce-key]'), 'Frame navigation while disabled leaves page text unchanged');
      change({allowedSites: ['127.0.0.1', 'localhost']});
      await waitFor(() => frame.contentDocument.querySelector('[data-cce-key]'));
      check(frame.contentDocument.querySelectorAll('[data-cce-key]').length === 1, 'Re-enabling decodes an already hooked frame after navigation once');
      frame.remove();
      await pause(150);
      const count = reads;
      change({mode: 'inline'});
      await loadAgain(document);
      check(reads === count && listeners.length === 1, 'Repeated injection after navigation/settings keeps one controller');
      const routine = document.createElement('div');
      routine.style.cssText = 'position:fixed;left:24px;top:24px;width:500px;height:144px;overflow:hidden';
      const routineFrame = document.createElement('iframe');
      routineFrame.style.height = '480px';
      routineFrame.srcdoc = `<!doctype html><style>
        body {font:14px system-ui} p {position:absolute;left:30px;margin:0}
        #upper {top:12px} #lower {top:91px}
      </style><p id="upper">CSE 3421</p><p id="lower">CSE 3421</p>`;
      routine.appendChild(routineFrame);
      document.body.appendChild(routine);
      await waitFor(() => routineFrame.contentDocument.querySelector('#lower [data-cce-key]'));
      const routineDoc = routineFrame.contentDocument;
      const routineTip = routineDoc.querySelector('.cce-global-tooltip');
      const visibleBottom = routine.getBoundingClientRect().bottom - routineFrame.getBoundingClientRect().top - routineFrame.clientTop;
      for (const mode of ['tooltip', 'highlight', 'inline']) {
        change({mode});
        const lower = routineDoc.querySelector('#lower [data-cce-key]');
        lower.dispatchEvent(new MouseEvent('mouseover', {bubbles: true}));
        await waitFor(() => routineTip.classList.contains('cce-visible'));
        const above = routineTip.getBoundingClientRect();
        const lowerCode = lower.querySelector('.cce-inline-code') || lower;
        check(routineTip.dataset.placement === 'above' && above.top >= 0 && above.bottom <= lowerCode.getBoundingClientRect().top - 8,
          `${mode} hover opens above a course near the clipped frame edge`);
        if (mode === 'tooltip') {
          const details = routineTip.firstElementChild;
          check(details.scrollHeight > details.clientHeight && above.bottom <= visibleBottom,
            'Long details scroll within the visible frame');
        }
        const upper = routineDoc.querySelector('#upper [data-cce-key]');
        upper.dispatchEvent(new FocusEvent('focusin', {bubbles: true}));
        await waitFor(() => routineTip.classList.contains('cce-visible'));
        const below = routineTip.getBoundingClientRect();
        const upperCode = upper.querySelector('.cce-inline-code') || upper;
        check(routineTip.dataset.placement === 'below' && below.top >= upperCode.getBoundingClientRect().bottom + 8 && below.bottom <= visibleBottom,
          `${mode} keyboard focus opens below a course near the top edge`);
      }
      document.getElementById('results').textContent = 'PASS ' + checks.length + '\n' + checks.join('\n');
      document.documentElement.dataset.result = 'pass';
    } catch (error) {
      const frame = document.getElementById('frame');
      document.getElementById('results').textContent = 'FAIL after ' + checks.length + ': ' + error.stack + '\n' + JSON.stringify({
        owned: frame?.contentWindow.__UIU_COURSE_DECODER_INJECTED__,
        frameText: frame?.contentDocument.body?.textContent,
        frameStyles: frame?.contentDocument.querySelectorAll('#cce-custom-styles').length,
        frameTooltips: frame?.contentDocument.querySelectorAll('.cce-global-tooltip').length,
        runtimeErrors
      });
      document.documentElement.dataset.result = 'fail';
    }
  })();
</script>
