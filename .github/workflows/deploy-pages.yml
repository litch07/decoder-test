# .github/workflows/deploy-pages.yml
# Deploys the UIU Course Companion web catalog & documentation to GitHub Pages.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'courses.json'
      - '.github/workflows/deploy-pages.yml'
      - 'course-data.js'
      - 'scripts/sync_catalog.js'
      - 'scripts/validate_catalog.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and validate public catalog
        run: |
          node scripts/sync_catalog.js
          node scripts/validate_catalog.js

      - name: Verify repository Pages configuration
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              if (data.build_type !== 'workflow') {
                core.setFailed(`Select GitHub Actions as the Pages source: https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`);
              }
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`GitHub Pages is not enabled or is unavailable to this repository. Enable it and select GitHub Actions at https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages, then rerun this workflow.`);
              } else {
                throw error;
              }
            }

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

