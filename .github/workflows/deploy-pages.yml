# .github/workflows/deploy-pages.yml
# Deploys the UIU Course Code Decoder web catalog & documentation to GitHub Pages.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'courses.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync courses.json into docs/
        run: |
          echo "Ensuring docs/courses.json is strictly in sync with root courses.json..."
          cp courses.json docs/courses.json
          node -e "
            const fs = require('fs');
            const root = fs.readFileSync('courses.json', 'utf8');
            const docs = fs.readFileSync('docs/courses.json', 'utf8');
            if (root !== docs) {
              console.error('FAIL: docs/courses.json out of sync with courses.json');
              process.exit(1);
            }
            console.log('OK: docs/courses.json synchronized successfully');
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

